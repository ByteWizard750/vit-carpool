name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Deploy built images to AWS EC2 production host'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1: Continuous Integration (Typecheck, Lint & Automated Tests)
  # ============================================================================
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vit_carpool_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/vit_carpool_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/vit_carpool_test?schema=public
      LOCATION_PROVIDER: mock
      NODE_ENV: test
      JWT_TEST_MODE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package (Prisma client & declarations)
        run: pnpm build:db

      - name: Provision app_user role in test database
        run: |
          echo "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user WITH LOGIN PASSWORD 'app_user_dev_pw'; ELSE ALTER ROLE app_user WITH PASSWORD 'app_user_dev_pw'; END IF; END \$\$;" | pnpm --filter @vit-carpool/db exec prisma db execute --stdin --url="$DATABASE_URL"

      - name: Apply Prisma migrations to isolated test database
        run: pnpm --filter @vit-carpool/db exec prisma migrate deploy

      - name: Verify TypeScript types across monorepo
        run: pnpm typecheck

      - name: Run automated test suites
        run: pnpm test

  # ============================================================================
  # Stage 2: Build & Push Production Docker Images (ARM64 / Graviton2)
  # ============================================================================
  build-and-push:
    name: Build & Push ARM64 Container Images
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for Docker tagging
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # --- Build & Push API Image ---
      - name: Build and push API image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bytewizard750/vit-carpool-api:latest
            ghcr.io/bytewizard750/vit-carpool-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # --- Build & Push Web Image ---
      - name: Build and push Web image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bytewizard750/vit-carpool-web:latest
            ghcr.io/bytewizard750/vit-carpool-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ============================================================================
  # Stage 3: Zero-Downtime Deployment to AWS EC2 (Mumbai ap-south-1)
  # ============================================================================
  deploy:
    name: Zero-Downtime EC2 Rolling Deploy
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 == true
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "[+] Authenticating with GitHub Container Registry on EC2..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "[+] Navigating to application directory..."
            cd /opt/vit-carpool

            echo "[+] Pulling latest repository orchestration definitions..."
            git fetch origin main
            git reset --hard origin/main

            echo "[+] Executing production deployment script..."
            export API_IMAGE="ghcr.io/bytewizard750/vit-carpool-api:${{ github.sha }}"
            export WEB_IMAGE="ghcr.io/bytewizard750/vit-carpool-web:${{ github.sha }}"
            ./scripts/deploy.sh

